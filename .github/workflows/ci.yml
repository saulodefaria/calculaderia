name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-auth-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calculaderia?schema=public
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build application
        run: pnpm build

      - name: Archive build output
        run: tar --exclude='.next/cache' --exclude='.next/dev' -czf next-build.tgz .next

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tgz
          retention-days: 1

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Run unit tests
        run: pnpm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    env:
      PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm exec next start --hostname localhost --port 3100
      PLAYWRIGHT_WORKERS: "4"
      PLAYWRIGHT_SKIP_WARMUP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Restore build output
        run: tar -xzf next-build.tgz

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
